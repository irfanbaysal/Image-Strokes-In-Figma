<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figma Strokes</title>
<!--STYLES-->
</head>
<body>
<main class="panel">
  <h1>Figma Strokes</h1>
  <div class="preview-wrap">
  <div class="preview" id="preview" tabindex="0" role="group" aria-label="Preview. Scroll to zoom, drag to pan.">
    <canvas id="preview-canvas" width="326" height="196" aria-hidden="true"></canvas>
    <div class="zoom-controls" id="zoom-controls">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-fit" aria-label="Fit to view">Fit</button>
    </div>
  </div>
  <span class="caption" id="preview-note">Preview at 100%</span>
  </div>
  <div class="row">
    <div class="field">
      <label for="width" id="width-label" title="Drag to change">Width</label>
      <input id="width" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="width-error">
      <span class="field-error" id="width-error"></span>
    </div>
    <div class="field">
      <label for="color-hex">Color</label>
      <div class="color-row">
        <button id="color-swatch" type="button" class="swatch" aria-label="Choose color"></button>
        <input id="color-hex" type="text" autocomplete="off" spellcheck="false" aria-describedby="color-error">
        <div id="color-picker" class="picker-popover" hidden></div>
      </div>
      <span class="field-error" id="color-error"></span>
    </div>
  </div>
  <p class="source" id="source"></p>
  <button id="create" type="button" class="primary" disabled>Create Stroke</button>
  <p class="message" id="message" role="status" aria-live="polite"></p>
</main>
<!--SCRIPT-->
</body>
</html>
